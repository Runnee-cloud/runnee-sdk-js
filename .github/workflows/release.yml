name: Release
on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Exact package version to build
        required: true
        default: "0.1.0"
        type: string
      publish:
        description: Publish publicly after environment approval
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: sdk-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Verify version
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: node -e "if(require('./package.json').version !== process.env.EXPECTED_VERSION) process.exit(1)"
      - run: npm ci
      - run: npm run build && npm test && npm run typecheck && npm run format:check
      - run: npx tsc --noEmit --strict --target es2022 --module nodenext tests/types.mts
      - run: npm pack
      - name: Install packed package into a clean consumer
        run: npm install --prefix "$RUNNER_TEMP/runnee-consumer" "$PWD/$(node -p 'require("./package.json").name.replace("@","").replace("/","-")+"-"+require("./package.json").version+".tgz')" --ignore-scripts --offline --no-audit --no-fund
      - name: Check installed ESM and CommonJS exports
        working-directory: ${{ runner.temp }}/runnee-consumer
        run: |
          node --input-type=module -e "import { Runnee } from '@runnee/sdk'; if (typeof Runnee !== 'function') throw Error('Invalid ESM export')"
          node -e "if(typeof require('@runnee/sdk').Runnee !== 'function') throw Error('Invalid CJS export')"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: "*.tgz"
          if-no-files-found: error
  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - run: npm publish dist/*.tgz --access public --provenance --ignore-scripts
